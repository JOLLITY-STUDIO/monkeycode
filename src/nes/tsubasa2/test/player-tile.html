<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>天使之翼2 — 球员 tile 素材浏览器 (PT1-PT3 验证页)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Consolas', 'Menlo', 'Courier New', monospace;
      background: #0a0a1a;
      color: #e0e0e0;
      padding: 14px;
      font-size: 13px;
    }
    h1 { color: #4fc3f7; font-size: 18px; margin: 0 0 8px 0; }
    h1 .sub { color: #888; font-size: 12px; font-weight: normal; }
    p.hint { color: #888; font-size: 12px; margin: 0 0 14px 0; }
    .toolbar {
      display: flex; gap: 12px; align-items: center; margin-bottom: 12px;
      padding: 8px 12px; background: #050510; border: 1px solid #333; border-radius: 4px;
    }
    .toolbar input, .toolbar select {
      background: #0a0a1a; color: #e0e0e0; border: 1px solid #444; padding: 4px 8px;
      font-family: inherit; font-size: 12px; border-radius: 3px;
    }
    .toolbar label { color: #888; font-size: 12px; }
    .stat { color: #d29922; font-size: 12px; margin-left: auto; }
    .stat b { color: #4fc3f7; }

    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .panel { background: #050510; border: 1px solid #333; border-radius: 4px; padding: 12px; }
    .panel h2 { color: #4fc3f7; font-size: 14px; margin: 0 0 10px 0; }
    .panel h2 .badge { background: #1a1a3a; color: #8b949e; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-left: 6px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th {
      background: #1a1a3a; color: #4fc3f7; text-align: left; padding: 5px 8px;
      border-bottom: 2px solid #2a3a6a; font-weight: bold; position: sticky; top: 0;
    }
    tbody td { padding: 4px 8px; border-bottom: 1px solid #1a1a2a; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #1a1a3a; }
    tbody tr.selected { background: #2a4a8a; color: #fff; }
    tbody tr.err { background: #3a1a1a; }

    .id { color: #888; font-family: monospace; font-size: 11px; }
    .hex { color: #ffb74d; font-family: monospace; font-size: 11px; }
    .pos-fw { color: #ff8a65; font-weight: bold; }
    .pos-gk { color: #4fc3f7; font-weight: bold; }

    .detail-empty { color: #888; text-align: center; padding: 24px; }
    .detail-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; margin-bottom: 4px; font-size: 12px; }
    .detail-row .k { color: #888; }
    .detail-row .v { color: #e0e0e0; }
    .detail-row .v .hex { color: #ffb74d; }
    .swatch { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 4px; border: 1px solid #333; }

    .tile-list {
      display: flex; flex-wrap: wrap; gap: 3px; max-height: 100px; overflow: auto;
      padding: 4px; background: #0a0a1a; border-radius: 3px;
    }
    .tile-cell {
      width: 22px; height: 22px; background: #000; display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #4fc3f7; border: 1px solid #2a2a3a;
    }
    .tile-cell.zero { color: #555; }

    .err { color: #f85149; padding: 12px; }
    .ok { color: #3fb950; }

    .summary { padding: 6px 10px; background: #0a1a0a; border: 1px solid #238636; border-radius: 3px; margin-bottom: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>天使之翼2 — 球员 tile 素材浏览器 <span class="sub">/ PT1-PT3 验证 (PLAYER_TABLE + PLAYER_HAIR_TABLE + PLAYER_COLOR_TABLE + BANK19_SPRITE_FRAMES)</span></h1>
  <p class="hint">球员 ID → hair/body/palette 桥接验证 · 渲染 PT2 + PT3 真实产物 · 错误/缺失会标红</p>

  <div class="toolbar">
    <label>搜索 <input id="searchInput" type="text" placeholder="id hex / name / position" style="width:240px"></label>
    <label>位置 <select id="posFilter"><option value="">全部</option><option value="0">FW/MF</option><option value="1">GK</option></select></label>
    <span class="stat" id="statTotal">总 <b>0</b> · 通过 <b>0</b> · 失败 <b>0</b></span>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>球员列表 <span class="badge" id="listCount">0</span></h2>
      <div style="max-height:560px; overflow:auto">
        <table id="playerTable">
          <thead>
            <tr>
              <th>ID</th><th>名字</th><th>位置</th>
              <th>hair</th><th>body</th><th>palette</th><th>tile#</th>
            </tr>
          </thead>
          <tbody id="playerTbody"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <h2>球员 tile 详情 <span class="badge" id="detailBadge">未选择</span></h2>
      <div id="detailPane"><div class="detail-empty">点击左侧任意球员查看 tile 序列 + 调色板 + 4 帧动画</div></div>
    </div>
  </div>

  <script src="player-tile-bundle.cjs?v=2026-08-25-pt1"></script>
</body>
</html>
