<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>天使之翼2 — 球队浏览器</title>
  <style>
    body {
      font-family: 'Consolas', 'Menlo', 'Courier New', monospace;
      background: #0a0a1a;
      color: #e0e0e0;
      padding: 14px;
      margin: 0;
      font-size: 13px;
    }
    h1 { color: #4fc3f7; font-size: 18px; margin: 0 0 8px 0; }
    p.hint { color: #888; font-size: 12px; margin: 0 0 14px 0; }
    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 14px;
      align-items: start;
    }
    .left, .right {
      background: #050510;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 14px;
      overflow: auto;
    }
    .right h2 { color: #4fc3f7; margin: 0 0 8px 0; font-size: 16px; }
    .right h2 .id { color: #888; font-size: 12px; font-weight: normal; }
    .right .meta { color: #888; margin-bottom: 12px; font-size: 12px; }
    .right .meta .ja { color: #ffb74d; }
    .right .meta .zh { color: #81c784; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    thead th {
      background: #1a1a3a;
      color: #4fc3f7;
      text-align: left;
      padding: 6px 10px;
      border-bottom: 2px solid #2a3a6a;
      font-weight: bold;
      position: sticky;
      top: 0;
    }
    tbody td {
      padding: 5px 10px;
      border-bottom: 1px solid #1a1a2a;
    }
    tbody tr:hover {
      background: #1a1a3a;
    }
    table.teams tbody tr {
      cursor: pointer;
    }
    table.teams tbody tr.selected {
      background: #2a4a8a;
      color: #fff;
    }
    .id {
      color: #888;
      font-size: 12px;
      font-family: monospace;
    }
    .pos-fw { color: #ff8a65; font-weight: bold; }
    .pos-gk { color: #4fc3f7; font-weight: bold; }
    .err { color: #df7f7f; padding: 14px; }
  </style>
</head>
<body>
  <h1>天使之翼2 — 球队浏览器</h1>
  <p class="hint">左侧:全部队伍 · 点击队名查看 11 人阵容 + 7 项属性 (HTML table 渲染)</p>
  <div class="layout">
    <div class="left">
      <div id="team-list">加载中...</div>
    </div>
    <div class="right">
      <div id="team-detail">点击左侧任意球队查看阵容 + 全部 7 项属性 ...</div>
    </div>
  </div>
  <script src="api-test-teams-bundle.cjs"></script>
</body>
</html>
