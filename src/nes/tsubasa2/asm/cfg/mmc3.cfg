    PRG9:    type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG10:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG11:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG12:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG13:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG14:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG15:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG16:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG17:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
