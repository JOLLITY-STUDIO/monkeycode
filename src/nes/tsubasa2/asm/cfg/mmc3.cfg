    PRG24:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG25:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG26:   type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
