    PRG30:   type = ro, start = $C000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG31:   type = ro, start = $E000,    size = $1FFA, file = %O, fill = yes, fillval = $FF;
    VECTORS: type = ro, start = $FFFA,    size = $0006, file = %O, fill = yes, fillval = $FF;
    CHR:     type = ro, start = $0000,    size = $20000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;
    PRG00:  load = PRG0,  type = ro;
    PRG01:  load = PRG1,  type = ro;
    PRG02:  load = PRG2,  type = ro;
