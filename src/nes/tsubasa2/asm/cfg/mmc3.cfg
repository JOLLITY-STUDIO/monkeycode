; 链接器配置: MMC3 PRG 256KB (32 × 8KB bank) + CHR 128KB
; 天使之翼2 内存布局:
;   CPU: $6000-$7FFF PRG RAM (8KB battery)
;        $8000-$9FFF R6 (bank0-31 可切)
;        $A000-$BFFF R7 (bank0-31 可切)
;        $C000-$DFFF 固定 bank30
;        $E000-$FFFF 固定 bank31 (含 Reset/NMI/IRQ 向量)

MEMORY {
    HEADER:  type = ro, start = $0000,    size = $0010, file = %O, fill = yes, fillval = $00;
    PRG0:    type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG1:    type = ro, start = $8000,    size = $2000, file = %O, fill = yes, fillval = $FF;
