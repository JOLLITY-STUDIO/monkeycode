<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tsubasa NES — H5 双引擎对比</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 {
      font-size: 1.2rem;
      padding: 12px 0 6px;
      color: #e94560;
      letter-spacing: 2px;
    }
    .canvas-wrap {
      display: flex; gap: 16px; flex-wrap: wrap;
      justify-content: center; padding: 0 8px;
    }
    .canvas-box {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }
    .canvas-box .label {
      font-size: 0.7rem;
      color: #aaa; padding-bottom: 4px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    .controls {
      margin-top: 12px;
      display: flex; gap: 10px; flex-wrap: wrap;
      justify-content: center; align-items: center;
    }
    button {
      background: #0f3460; color: #e0e0e0;
      border: 1px solid #e94560; border-radius: 4px;
      padding: 6px 14px; cursor: pointer;
      font-family: inherit; font-size: 0.75rem;
    }
    button:hover { background: #e94560; color: #fff; }
    button.active { background: #e94560; }
    .fps { font-size: 0.7rem; color: #888; min-width: 120px; }
    #status { font-size: 0.7rem; color: #f0a500; margin-top: 4px; }
    .info { font-size: 0.65rem; color: #666; padding: 8px 16px; max-width: 540px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>⚽ 天使之翼 II · 双引擎对比</h1>

  <div class="canvas-wrap">
    <div class="canvas-box">
      <div class="label">左: CPU 模拟器 (参考)</div>
      <canvas id="c0" width="256" height="240"></canvas>
    </div>
    <div class="canvas-box">
      <div class="label">右: Bank 翻译 (新引擎)</div>
      <canvas id="c1" width="256" height="240"></canvas>
    </div>
  </div>

  <div class="controls">
    <button id="btn-run" class="active">▶ 运行</button>
    <button id="btn-pause">⏸ 暂停</button>
    <button id="btn-step">⏭ 单帧</button>
    <button id="btn-reset">↺ 重置</button>
    <span class="fps" id="fps">FPS: -- / --</span>
  </div>
  <div id="status">初始化中…</div>
  <div class="info">
    键盘: Z=ⓐ X=ⓑ 方向键=移动 Enter=Start Shift=Select<br/>
    双引擎共享键盘输入，逐帧对比 CPU 模拟 vs TypeScript 翻译。
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
