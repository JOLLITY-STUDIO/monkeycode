<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tsubasa Mock Frame Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.1rem;
      padding: 12px 0 6px;
      color: #e94560;
      letter-spacing: 2px;
    }
    .main {
      display: flex; gap: 16px; flex-wrap: wrap;
      justify-content: center; padding: 8px;
    }
    .box {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .box .label {
      font-size: 0.7rem;
      color: #aaa; padding-bottom: 6px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      border: 1px solid #333;
    }
    .controls {
      margin: 12px 0;
      display: flex; gap: 10px; flex-wrap: wrap;
      justify-content: center; align-items: center;
    }
    button {
      background: #0f3460; color: #e0e0e0;
      border: 1px solid #e94560; border-radius: 4px;
      padding: 6px 14px; cursor: pointer;
      font-family: inherit; font-size: 0.75rem;
    }
    button:hover { background: #e94560; color: #fff; }
    button.active { background: #e94560; }
    #info {
      font-size: 0.7rem; color: #888;
      margin-top: 8px; max-width: 600px; line-height: 1.4;
    }
    #status {
      font-size: 0.7rem; color: #f0a500; margin-top: 4px;
    }
    .stats {
      font-size: 0.65rem; color: #666; margin: 4px 0;
    }
  </style>
</head>
<body>
  <h1>⚽ Mock Frame — 幀緩存查看器</h1>

  <div class="main">
    <div class="box">
      <div class="label">BMP 幀 (ppu-frame.bmp)</div>
      <canvas id="c-bmp" width="256" height="240"></canvas>
    </div>
    <div class="box">
      <div class="label">原始 RGBA</div>
      <canvas id="c-raw" width="256" height="240"></canvas>
    </div>
    <div class="box">
      <div class="label">4× 放大</div>
      <canvas id="c-4x" width="1024" height="960"></canvas>
    </div>
  </div>

  <div class="controls">
    <button id="btn-load">📂 載入 BMP</button>
    <button id="btn-refresh">🔄 重新渲染</button>
    <button id="btn-auto" class="active">▶ 自動刷新</button>
    <span id="fps-counter" class="stats">FPS: --</span>
  </div>

  <div id="status">拖放 .bmp 檔案到任何畫布上，或按「載入 BMP」</div>
  <div class="stats" id="info">
    這個頁面讀取 Node.js 測試腳本 (test-mock-frame.ts) 產生的 BMP 幀檔案。<br/>
    左: BMP 解析結果 · 中: 原始像素數據 · 右: 4× 無濾鏡放大。
  </div>

  <script type="module">
    // ═══════════════════════════════════════
    // Canvas 上下文
    // ═══════════════════════════════════════
    const cBmp  = /** @type {HTMLCanvasElement} */ (document.getElementById('c-bmp'));
    const cRaw  = /** @type {HTMLCanvasElement} */ (document.getElementById('c-raw'));
    const c4x   = /** @type {HTMLCanvasElement} */ (document.getElementById('c-4x'));
    const ctxBmp  = cBmp.getContext('2d', { willReadFrequently: true });
    const ctxRaw  = cRaw.getContext('2d', { willReadFrequently: true });
    const ctx4x   = c4x.getContext('2d');
    ctxBmp.imageSmoothingEnabled = false;
    ctxRaw.imageSmoothingEnabled = false;
    ctx4x.imageSmoothingEnabled = false;
    ctxBmp.fillStyle = '#000'; ctxBmp.fillRect(0, 0, 256, 240);
    ctxRaw.fillStyle = '#000'; ctxRaw.fillRect(0, 0, 256, 240);

    const W = 256, H = 240;

    /** @type {Uint32Array|null} */
    let rawBuffer = null;

    // ═══════════════════════════════════════
    // BMP 解析
    // ═══════════════════════════════════════

    /**
     * 解析 Windows BMP (32bpp, top-down)
     * @param {ArrayBuffer} buf
     * @returns {Uint32Array|null} 256×240 BGRA pixels
     */
    function parseBmp(buf) {
      if (buf.byteLength < 54) return null;
      const view = new DataView(buf);
      const sig = String.fromCharCode(view.getUint8(0), view.getUint8(1));
      if (sig !== 'BM') { console.warn('Not a BMP'); return null; }
      const dataOffset = view.getUint32(10, true);
      const bpp = view.getUint16(28, true);
      const bmpW = view.getInt32(18, true);
      const bmpH = Math.abs(view.getInt32(22, true));
      const topDown = view.getInt32(22, true) < 0;

      if (bpp !== 32) {
        console.warn(`BMP bpp=${bpp}, expected 32`);
        return null;
      }
      if (bmpW !== W || bmpH !== H) {
        console.warn(`BMP ${bmpW}×${bmpH}, expected ${W}×${H}`);
        // 仍然嘗試渲染
      }

      const rowLen = bmpW * 4;
      const pad = (4 - (rowLen % 4)) % 4;
      const pixels = new Uint32Array(bmpW * bmpH);

      for (let row = 0; row < bmpH; row++) {
        const srcRow = topDown ? row : (bmpH - 1 - row);
        for (let col = 0; col < bmpW; col++) {
          const offset = dataOffset + srcRow * (rowLen + pad) + col * 4;
          // BMP 文件字节点: [B][G][R][A] (PPU 写入时的原始字节序)
          // ImageData Uint32 LE 格式: 0xAABBGGRR → 字节序 [R][G][B][A]
          // 所以从 BMP 读到的 B=offset+0, G=offset+1, R=offset+2 需要映射到:
          //   Uint32 bit 0-7  (R通道) = red (BMP offset+2)
          //   Uint32 bit 8-15 (G通道) = green (BMP offset+1)
          //   Uint32 bit 16-23(B通道) = blue (BMP offset+0)
          //   Uint32 bit 24-31(A通道) = 0xFF (BMP alpha 始终为 0, canvas 需要 255)
          const blue  = view.getUint8(offset);
          const green = view.getUint8(offset + 1);
          const red   = view.getUint8(offset + 2);
          // Alpha 强制 0xFF — BMP 中 PPU buffer 高位=0, canvas 需要不透明
          pixels[row * bmpW + col] = (0xFF << 24) | (blue << 16) | (green << 8) | red;
        }
      }
      return pixels;
    }

    /**
     * 從 raw 像素緩存渲染到所有 canvas
     * @param {Uint32Array} pixels RGBA Uint32[]
     */
    function renderAll(pixels) {
      // cBmp: standard putImageData
      const idBmp = ctxBmp.createImageData(W, H);
      const bufBmp = new Uint32Array(idBmp.data.buffer);
      for (let i = 0; i < W * H; i++) bufBmp[i] = pixels[i];
      ctxBmp.putImageData(idBmp, 0, 0);

      // cRaw: direct load
      const idRaw = ctxRaw.createImageData(W, H);
      const bufRaw = new Uint32Array(idRaw.data.buffer);
      for (let i = 0; i < W * H; i++) bufRaw[i] = pixels[i];
      ctxRaw.putImageData(idRaw, 0, 0);

      // c4x: 4× scale
      ctx4x.drawImage(cBmp, 0, 0, W * 4, H * 4);
    }

    // ═══════════════════════════════════════
    // UI 事件
    // ═══════════════════════════════════════

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    async function loadBmpFile(file) {
      if (!file) {
        // default: try ppu-frame.bmp
        try {
          const resp = await fetch('ppu-frame.bmp');
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const buf = await resp.arrayBuffer();
          rawBuffer = parseBmp(buf);
          if (rawBuffer) {
            renderAll(rawBuffer);
            setStatus(`加載完成: ppu-frame.bmp (${buf.byteLength} bytes)`);
          } else {
            setStatus('無法解析 BMP');
          }
        } catch (e) {
          setStatus(`無法加載 ppu-frame.bmp: ${e.message}`);
        }
      } else {
        const buf = await file.arrayBuffer();
        rawBuffer = parseBmp(buf);
        if (rawBuffer) {
          renderAll(rawBuffer);
          setStatus(`加載完成: ${file.name} (${buf.byteLength} bytes)`);
        } else {
          setStatus(`無法解析 ${file.name}`);
        }
      }
    }

    // 拖放
    [cBmp, cRaw, c4x].forEach(c => {
      c.addEventListener('dragover', e => { e.preventDefault(); });
      c.addEventListener('drop', e => {
        e.preventDefault();
        const file = e.dataTransfer?.files?.[0];
        if (file) loadBmpFile(file);
      });
    });

    document.getElementById('btn-load').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.bmp';
      input.onchange = () => { if (input.files?.[0]) loadBmpFile(input.files[0]); };
      input.click();
    });

    document.getElementById('btn-refresh').addEventListener('click', () => {
      if (rawBuffer) {
        renderAll(rawBuffer);
        setStatus('重新渲染完成');
      } else {
        loadBmpFile(null);
      }
    });

    // 自動刷新
    let autoRefresh = true;
    let rafId = 0;
    let fpsCount = 0, fpsTime = performance.now();

    document.getElementById('btn-auto').addEventListener('click', function() {
      autoRefresh = !autoRefresh;
      this.classList.toggle('active', autoRefresh);
      if (autoRefresh) {
        startAutoRefresh();
      } else {
        cancelAnimationFrame(rafId);
      }
    });

    function startAutoRefresh() {
      function loop(t) {
        if (!autoRefresh) return;
        rafId = requestAnimationFrame(loop);

        if (rawBuffer) renderAll(rawBuffer);

        fpsCount++;
        if (t - fpsTime > 1000) {
          document.getElementById('fps-counter').textContent =
            `FPS: ${Math.round(fpsCount / ((t - fpsTime) / 1000))}`;
          fpsCount = 0;
          fpsTime = t;
        }
      }
      rafId = requestAnimationFrame(loop);
    }

    // ═══════════════════════════════════════
    // 啟動
    // ═══════════════════════════════════════
    loadBmpFile(null);
    startAutoRefresh();
  </script>
</body>
</html>
