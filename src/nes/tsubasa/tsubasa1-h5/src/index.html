<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天使之翼1 — Captain Tsubasa Vol. I (H5)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }
    
    h1 {
      margin: 10px 0;
      font-size: 18px;
      color: #ffd700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    
    .game-wrapper {
      position: relative;
      border: 3px solid #444;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 200, 0.3);
    }
    
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    button {
      background: #2a2a4a;
      color: #e0e0e0;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
    }
    
    button:hover { background: #3a3a6a; }
    button.active { background: #5a5a9a; border-color: #88f; }
    
    .debug-panel {
      margin-top: 10px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.5;
      min-width: 300px;
      text-align: left;
    }
    
    .debug-panel span {
      color: #0f0;
    }
    
    .key-hint {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
    }
    
    .key-hint kbd {
      background: #333;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <h1>🏆 天使之翼1 — Captain Tsubasa Vol. I</h1>
  
  <div class="game-wrapper">
    <canvas id="game-canvas" width="512" height="480"></canvas>
  </div>
  
  <div class="controls">
    <button id="btn-start">START</button>
    <button id="btn-select">SELECT</button>
    <button id="btn-a">A</button>
    <button id="btn-b">B</button>
    <button id="btn-up">↑</button>
    <button id="btn-down">↓</button>
    <button id="btn-left">←</button>
    <button id="btn-right">→</button>
    <button id="btn-ai" style="background:#553300;">AI模式</button>
    <button id="btn-debug">调试</button>
    <button id="btn-reset">重置</button>
  </div>
  
  <div class="debug-panel" id="debug-panel" style="display:none;">
    <div>帧: <span id="db-frame">0</span></div>
    <div>状态: <span id="db-state">-</span></div>
    <div>比分: <span id="db-score">0 - 0</span></div>
    <div>FPS: <span id="db-fps">0</span></div>
  </div>
  
  <div class="key-hint">
    键盘: <kbd>Enter</kbd>=START <kbd>Shift</kbd>=SELECT 
    <kbd>Z</kbd>=A <kbd>X</kbd>=B 
    <kbd>↑↓←→</kbd>=方向
  </div>

  <script type="module">
    import { Tsubasa } from './core/Tsubasa.js';
    import { BUTTON } from './core/types.js';

    // ====== 初始化 ======
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    const game = new Tsubasa(ctx, {
      scale: 2,
      debug: false,
    });
    
    // ====== 键盘输入 ======
    const keyMap = {
      'Enter':    BUTTON.START,
      'Shift':    BUTTON.SELECT,
      'z':        BUTTON.A,
      'Z':        BUTTON.A,
      'x':        BUTTON.B,
      'X':        BUTTON.B,
      'ArrowUp':  BUTTON.UP,
      'ArrowDown':BUTTON.DOWN,
      'ArrowLeft':BUTTON.LEFT,
      'ArrowRight':BUTTON.RIGHT,
    };
    
    let currentButtons = 0;
    
    document.addEventListener('keydown', (e) => {
      const btn = keyMap[e.key];
      if (btn !== undefined) {
        e.preventDefault();
        currentButtons |= btn;
        game.setButton1(currentButtons);
      }
    });
    
    document.addEventListener('keyup', (e) => {
      const btn = keyMap[e.key];
      if (btn !== undefined) {
        e.preventDefault();
        currentButtons &= ~btn;
        game.setButton1(currentButtons);
      }
    });
    
    // ====== 按钮事件 ======
    function setupButton(id, button, key) {
      const el = document.getElementById(id);
      if (!el) return;
      
      el.addEventListener('mousedown', () => {
        el.classList.add('active');
        game.pressButton(key || button);
      });
      
      el.addEventListener('mouseup', () => {
        el.classList.remove('active');
        game.releaseButton(key || button);
      });
      
      el.addEventListener('mouseleave', () => {
        el.classList.remove('active');
        game.releaseButton(key || button);
      });
      
      // 触摸事件
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        el.classList.add('active');
        game.pressButton(key || button);
      });
      
      el.addEventListener('touchend', (e) => {
        e.preventDefault();
        el.classList.remove('active');
        game.releaseButton(key || button);
      });
    }
    
    setupButton('btn-start', 'START');
    setupButton('btn-select', 'SELECT');
    setupButton('btn-a', 'A');
    setupButton('btn-b', 'B');
    setupButton('btn-up', 'UP');
    setupButton('btn-down', 'DOWN');
    setupButton('btn-left', 'LEFT');
    setupButton('btn-right', 'RIGHT');
    
    // AI模式
    let aiMode = false;
    document.getElementById('btn-ai').addEventListener('click', () => {
      aiMode = !aiMode;
      document.getElementById('btn-ai').style.background = aiMode ? '#885500' : '#553300';
      document.getElementById('btn-ai').textContent = aiMode ? 'AI:ON' : 'AI模式';
      if (aiMode) {
        game.enableAi();
      } else {
        game.disableAi();
      }
    });
    
    // 调试面板
    let showDebug = false;
    const debugPanel = document.getElementById('debug-panel');
    document.getElementById('btn-debug').addEventListener('click', () => {
      showDebug = !showDebug;
      debugPanel.style.display = showDebug ? 'block' : 'none';
    });
    
    // 重置
    document.getElementById('btn-reset').addEventListener('click', () => {
      game.reset();
    });
    
    // ====== 调试信息更新 ======
    setInterval(() => {
      if (!showDebug) return;
      const info = game.getDebugInfo();
      document.getElementById('db-frame').textContent = info.frame;
      document.getElementById('db-state').textContent = info.gameStateName;
      document.getElementById('db-score').textContent = `${info.scoreA} - ${info.scoreB}`;
      document.getElementById('db-fps').textContent = game.getFps();
    }, 500);
    
    // ====== 加载ROM数据并启动 ======
    async function loadAndStart() {
      try {
        // 加载PRG Bank数据
        const prgResp = await fetch('./data/raw/prg_bulk.json');
        const prgData = await prgResp.json();
        game.loadPrgBanks(prgData);
        console.log(`[Loader] PRG数据已加载: ${prgData.length} 个Bank`);
        
        // 加载CHR Bank数据
        const chrResp = await fetch('./data/raw/chr_bulk.json');
        const chrData = await chrResp.json();
        for (const entry of chrData) {
          const binary = atob(entry.base64);
          const data = new Uint8Array(entry.size);
          for (let i = 0; i < entry.size; i++) {
            data[i] = binary.charCodeAt(i);
          }
          game.loadChrBank(entry.bankId, data);
        }
        console.log(`[Loader] CHR数据已加载: ${chrData.length} 个Bank`);
        
        // 启动游戏
        game.start();
        console.log('🏆 天使之翼1 — 启动完成!');
      } catch (err) {
        console.error('[Loader] 资源加载失败:', err);
        // 即使没有数据也尝试启动（会显示空白画面）
        game.start();
      }
    }
    
    loadAndStart();
  </script>
</body>
</html>
