<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Picross DS — HTML5 Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fffdf0;
      color: #111111;
      font-family: -apple-system, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .status {
      display: flex;
      gap: 24px;
      align-items: center;
      font-size: 15px;
    }
    .status b { color: #111; }
    .progress-wrap {
      width: min(520px, 80vw);
      height: 8px;
      background: #e0e0e0;
      border: 1px solid #999;
      border-radius: 4px;
      overflow: hidden;
    }
    #progress-bar { height: 100%; width: 0; background: #ffd800; transition: width .2s; }
    #board {
      width: min(480px, 92vw);
      height: min(360px, 70vh); /* NDS 4:3 */
      touch-action: none;
      background: #e8e8e8;
    }
    .toolbar { display: flex; gap: 10px; }
    .toolbar button {
      background: #ffd800;
      color: #111;
      border: 2px solid #111;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .toolbar button:hover { background: #ffb700; }
    #solved-mask {
      position: fixed; inset: 0;
      background: rgba(255,255,255,.85);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 700;
      color: #111;
      letter-spacing: 8px;
    }
  </style>
</head>
<body>
  <div class="status">
    <b id="puzzle-name">-</b>
    <span id="time">0:00</span>
    <span id="mistakes">✕ 0/5</span>
  </div>
  <div class="progress-wrap"><div id="progress-bar"></div></div>
  <canvas id="board"></canvas>
  <div class="toolbar">
    <button id="btn-prev">‹ 上一题</button>
    <button id="btn-mark">● 循环</button>
    <button id="btn-reset">重置</button>
    <button id="btn-next">下一题 ›</button>
  </div>
  <div id="solved-mask">CLEAR!</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
